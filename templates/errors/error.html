{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block page_title %}{{ title }}{% endblock %}
{% block shell %}
<main class="auth-wrapper d-flex align-items-center justify-content-center px-3 py-4">
  <div class="card shadow border-0 w-100 auth-card text-center">
    <div class="card-body p-4 p-sm-5">
      <div class="display-5 fw-bold text-primary">{{ code }}</div>
      <h1 class="h4 mt-2">{{ title }}</h1>
      <p class="text-muted text-break">{{ message }}</p>
      <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary"><i class="bi bi-house me-1"></i>Voltar ao painel</a>
    </div>
  </div>
</main>
{% endblock %}
